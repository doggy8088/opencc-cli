[package]
name = "opencc-cli"
version = "0.1.2"
edition = "2024"
authors = ["Will 保哥"]
description = "Pure Rust OpenCC Command Line Interface"
license = "MIT"
repository = "https://github.com/doggy8088/opencc-cli"
homepage = "https://github.com/doggy8088/opencc-cli"


[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
# crates.io 套件名稱是 opencc-rs-tw2（opencc-rust 已被其他專案使用），依賴名稱保留 opencc-rust
opencc-rust = { package = "opencc-rs-tw2", version = "0.1.2" }
anyhow = "1.0"

[dev-dependencies]
assert_cmd = "2.0.12"
predicates = "3.1.0"
tempfile = "3.10.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
npm-package = "@willh/opencc-cli"
